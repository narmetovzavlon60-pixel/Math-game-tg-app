<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0f19">
<title>Math Quest Academy Pro</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  background:var(--bg);
  color:var(--fg);
  font-size:15px;
  line-height:1.45;
  transition:background .3s ease,color .3s ease;
}
:root{
  --bg:#0b0f19;
  --bg2:#121829;
  --card:#1a2236;
  --card2:#232c47;
  --fg:#e9eefb;
  --muted:#8a94ae;
  --accent:#6d8bff;
  --accent2:#9b6dff;
  --good:#3ddc97;
  --bad:#ff6b7a;
  --warn:#ffd166;
  --gold:#ffd700;
  --border:rgba(255,255,255,.08);
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --radius:16px;
}
/* themes */
body.theme-aurora{--bg:#0b0f19;--bg2:#121829;--card:#1a2236;--card2:#232c47;--fg:#e9eefb;--muted:#8a94ae;--accent:#6d8bff;--accent2:#9b6dff}
body.theme-sunset{--bg:#1a0f1f;--bg2:#2a1530;--card:#3a1d44;--card2:#4c2856;--fg:#fdeef7;--muted:#c299b2;--accent:#ff7b6d;--accent2:#ffb86b}
body.theme-forest{--bg:#0c1512;--bg2:#13201b;--card:#1a2d26;--card2:#243d32;--fg:#e6f3ec;--muted:#8cb0a0;--accent:#4ade80;--accent2:#22d3ee}
body.theme-ocean{--bg:#071019;--bg2:#0c1a2a;--card:#122740;--card2:#1a3758;--fg:#e0f0ff;--muted:#80a0c0;--accent:#38bdf8;--accent2:#0ea5e9}
body.theme-lava{--bg:#170606;--bg2:#2a0a0a;--card:#3d1010;--card2:#561616;--fg:#ffeaea;--muted:#c08080;--accent:#ef4444;--accent2:#f97316}
body.theme-mint{--bg:#f0f7f4;--bg2:#e3efe8;--card:#ffffff;--card2:#f1f7f4;--fg:#0d2019;--muted:#5c776b;--accent:#10b981;--accent2:#06b6d4}
body.theme-candy{--bg:#fdf2f8;--bg2:#fce7f3;--card:#ffffff;--card2:#fdf2f8;--fg:#4a1d3a;--muted:#9d6b88;--accent:#ec4899;--accent2:#a855f7}
body.theme-graphite{--bg:#0c0c0d;--bg2:#17171a;--card:#202025;--card2:#2c2c33;--fg:#f0f0f3;--muted:#888895;--accent:#a1a1aa;--accent2:#d4d4d8}
body.theme-royal{--bg:#0f0b24;--bg2:#191340;--card:#251c5c;--card2:#342a7a;--fg:#ede9ff;--muted:#a29ad1;--accent:#c084fc;--accent2:#fbbf24}
body.theme-dark{--bg:#000000;--bg2:#0a0a0a;--card:#141414;--card2:#1f1f1f;--fg:#ffffff;--muted:#888888;--accent:#ffffff;--accent2:#a0a0a0}

/* ============ LAYOUT ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);opacity:0;transition:transform .3s ease,opacity .3s ease;background:var(--bg);pointer-events:none}
.screen.active{transform:translateX(0);opacity:1;pointer-events:auto}
.screen.back{transform:translateX(-20%)}
.header{
  flex:0 0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--border);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.header h1{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:var(--card);color:var(--fg);
  display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s;
}
.icon-btn:active{transform:scale(.92);background:var(--card2)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(80px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:0}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;gap:6px;
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:8px;z-index:50;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);
}
.nav-btn{
  flex:1;border:none;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;border-radius:14px;cursor:pointer;font-size:10px;font-weight:600;
  transition:all .2s;
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--fg);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.nav-btn:active{transform:scale(.95)}

/* ============ HOME / PROFILE HEADER ============ */
.hero{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;
  margin-bottom:14px;
}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.hero-name{font-size:20px;font-weight:800;letter-spacing:-.5px}
.hero-lvl{font-size:13px;opacity:.9;font-weight:600}
.hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;z-index:2}
.stat-pill{
  flex:1;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);
  border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;
}
.stat-label{font-size:10px;opacity:.8;text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.stat-value{font-size:16px;font-weight:800;display:flex;align-items:center;gap:4px}

.xp-bar{height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:12px;position:relative;z-index:2}
.xp-fill{height:100%;background:#fff;border-radius:99px;transition:width .4s ease;width:0}

/* ============ CARDS ============ */
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:16px 4px 10px;display:flex;align-items:center;gap:6px}
.section-title:first-child{margin-top:0}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .18s,background .2s;
  position:relative;overflow:hidden;
}
.card:active{transform:scale(.98);background:var(--card2)}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px}
.card-desc{font-size:12px;color:var(--muted);line-height:1.4}
.card-row{display:flex;align-items:center;gap:10px}
.card-badge{
  flex:0 0 auto;width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;
}
.card-meta{display:flex;gap:10px;margin-top:10px;align-items:center}
.chip{
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--card2);color:var(--muted);
}
.chip.accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.chip.good{background:rgba(61,220,151,.15);color:var(--good)}
.chip.bad{background:rgba(255,107,122,.15);color:var(--bad)}
.chip.warn{background:rgba(255,209,102,.15);color:var(--warn)}
.chip.gold{background:linear-gradient(135deg,#ffd700,#ffb700);color:#4a3500}

.progress-mini{
  flex:1;height:6px;background:var(--card2);border-radius:99px;overflow:hidden;
}
.progress-mini span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}

/* Levels grid */
.levels-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.level-tile{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 4px;text-align:center;cursor:pointer;transition:transform .15s;
}
.level-tile:active{transform:scale(.93)}
.level-num{font-size:16px;font-weight:800}
.level-name{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.level-tile.locked{opacity:.4}
.level-tile.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

/* Topic list */
.topic-card .card-badge{background:var(--card2);color:var(--muted);font-size:12px}
.topic-card.done .card-badge{background:linear-gradient(135deg,var(--good),#10b981);color:#fff}
.topic-card.locked{opacity:.55;pointer-events:none}
.lock-icon{position:absolute;top:14px;right:14px;width:16px;height:16px;color:var(--muted)}
.stars{display:flex;gap:2px;margin-left:auto}
.star{width:14px;height:14px;color:var(--muted)}
.star.filled{color:var(--gold)}

/* Topic detail */
.formula-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 14px;margin:10px 0;text-align:center;overflow-x:auto;
  font-size:20px;
}
.formula-box::-webkit-scrollbar{height:4px}
.formula-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.theory-p{margin-bottom:10px;font-size:14px;line-height:1.6;color:var(--fg);opacity:.9}
.btn-primary{
  width:100%;border:none;border-radius:14px;padding:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 18px rgba(109,139,255,.35);
  transition:transform .15s,box-shadow .2s;
  margin-top:10px;
}
.btn-primary:active{transform:scale(.97);box-shadow:0 2px 6px rgba(109,139,255,.35)}
.btn-secondary{
  width:100%;border:1px solid var(--border);border-radius:14px;padding:12px;
  background:var(--card);color:var(--fg);
  font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;
}
.btn-secondary:active{transform:scale(.98);background:var(--card2)}

/* Exercise */
.exercise-top{
  background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
}
.ex-progress{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted);font-weight:600}
.ex-progress .bar{flex:1;height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
.ex-progress .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.question-box{
  background:var(--bg2);border-radius:var(--radius);padding:20px 14px;
  text-align:center;font-size:18px;font-weight:700;margin:10px 0;
  min-height:70px;display:grid;place-items:center;
}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.answer-btn{
  padding:14px 10px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);font-size:16px;font-weight:700;cursor:pointer;
  transition:all .18s;min-height:54px;
}
.answer-btn:active{transform:scale(.96);background:var(--card2)}
.answer-btn.correct{background:var(--good);color:#fff;border-color:var(--good);animation:pop .4s}
.answer-btn.wrong{background:var(--bad);color:#fff;border-color:var(--bad);animation:shake .4s}
.answer-btn:disabled{cursor:not-allowed}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.answer-single{display:flex;flex-direction:column;gap:8px}
.input-answer{
  width:100%;padding:14px;border-radius:12px;border:2px solid var(--border);
  background:var(--bg2);color:var(--fg);font-size:18px;font-weight:700;text-align:center;
  outline:none;transition:border-color .2s;font-family:inherit;
}
.input-answer:focus{border-color:var(--accent)}

/* Settings */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px;background:var(--card);border-radius:12px;margin-bottom:8px;
}
.setting-label{font-size:14px;font-weight:600}
.setting-sub{font-size:11px;color:var(--muted);margin-top:2px}
.switch{width:44px;height:24px;border-radius:99px;background:var(--card2);position:relative;cursor:pointer;transition:background .2s;border:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.switch.on::after{transform:translateX(20px)}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.theme-opt{
  aspect-ratio:1;border-radius:12px;cursor:pointer;border:3px solid transparent;
  position:relative;overflow:hidden;transition:transform .15s,border-color .2s;
}
.theme-opt:active{transform:scale(.92)}
.theme-opt.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.theme-opt::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--p1),var(--p2))}
.theme-opt::after{content:"";position:absolute;bottom:0;left:0;right:0;height:40%;background:var(--p3)}
.theme-opt[data-t="aurora"]{--p1:#6d8bff;--p2:#9b6dff;--p3:#0b0f19}
.theme-opt[data-t="sunset"]{--p1:#ff7b6d;--p2:#ffb86b;--p3:#1a0f1f}
.theme-opt[data-t="forest"]{--p1:#4ade80;--p2:#22d3ee;--p3:#0c1512}
.theme-opt[data-t="ocean"]{--p1:#38bdf8;--p2:#0ea5e9;--p3:#071019}
.theme-opt[data-t="lava"]{--p1:#ef4444;--p2:#f97316;--p3:#170606}
.theme-opt[data-t="mint"]{--p1:#10b981;--p2:#06b6d4;--p3:#f0f7f4}
.theme-opt[data-t="candy"]{--p1:#ec4899;--p2:#a855f7;--p3:#fdf2f8}
.theme-opt[data-t="graphite"]{--p1:#a1a1aa;--p2:#d4d4d8;--p3:#0c0c0d}
.theme-opt[data-t="royal"]{--p1:#c084fc;--p2:#fbbf24;--p3:#0f0b24}
.theme-opt[data-t="dark"]{--p1:#ffffff;--p2:#a0a0a0;--p3:#000000}
.lang-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lang-btn{
  padding:12px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);cursor:pointer;font-weight:600;
}
.lang-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}

/* Achievements */
.ach-card{display:flex;gap:12px;align-items:center}
.ach-icon{
  width:48px;height:48px;border-radius:12px;flex:0 0 auto;
  background:var(--card2);display:grid;place-items:center;font-size:24px;
}
.ach-card.unlocked .ach-icon{background:linear-gradient(135deg,var(--gold),#ff9a00)}
.ach-body{flex:1}
.ach-prog{margin-top:6px;height:4px;background:var(--card2);border-radius:99px;overflow:hidden}
.ach-prog span{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent));border-radius:99px}

/* Daily tasks */
.task-card{display:flex;gap:12px;align-items:center}
.task-check{
  width:32px;height:32px;border-radius:50%;flex:0 0 auto;
  border:2px solid var(--border);display:grid;place-items:center;
  background:var(--bg2);color:transparent;transition:all .2s;font-weight:800;font-size:14px;
}
.task-card.done .task-check{background:var(--good);border-color:var(--good);color:#fff}
.task-reward{font-weight:700;color:var(--gold);font-size:12px}

/* Result modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .25s;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:380px;
  border:1px solid var(--border);text-align:center;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.modal-stat{background:var(--bg2);border-radius:12px;padding:10px 6px}
.modal-stat .v{font-size:18px;font-weight:800}
.modal-stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px}

/* Toast */
.toast{
  position:fixed;left:50%;top:20px;transform:translate(-50%,-140%);
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:10px 16px;font-weight:700;font-size:13px;z-index:200;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
}
.toast.show{transform:translate(-50%,0)}
.toast.good{border-color:var(--good)}
.toast.bad{border-color:var(--bad)}

/* misc */
.row{display:flex;gap:10px}
.row > *{flex:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin1 0.8s linear infinite}
@keyframes spin1{to{transform:rotate(360deg)}}

.exam-banner{
  background:linear-gradient(135deg,var(--warn),var(--gold));color:#2a1e00;
  border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;
  cursor:pointer;transition:transform .15s;
}
.exam-banner:active{transform:scale(.98)}

/* Fade in for list items */
.fade-in{animation:fadeInUp .35s both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Tablet */
@media (min-width:600px){
  body{font-size:16px}
  .content{max-width:720px;margin:0 auto;width:100%;padding-left:24px;padding-right:24px}
  .answers{grid-template-columns:1fr 1fr}
  .bottom-nav{left:50%;transform:translateX(-50%);max-width:500px}
}
</style>
</head>
<body class="theme-aurora">

<div id="app">
  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="header">
      <h1 id="app-title">Math Quest Academy Pro</h1>
      <button class="icon-btn" id="btn-settings" aria-label="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="content" id="home-content"></div>

/* -------- Sound Engine (soft synthesized UI sounds, no external files) -------- */
const SoundEngine = (function(){
  let ctx = null;
  function getCtx(){
    if(!ctx){
      try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  // Unlock/resume audio on first user interaction (required by mobile browsers & Telegram webview)
  ['pointerdown','touchstart','click'].forEach(evt=>{
    document.addEventListener(evt, ()=>{ getCtx(); }, {once:true, passive:true});
  });

  // One soft, filtered sine "note" with a gentle envelope — avoids any harsh/clicky digital edge
  function note(freq, {dur=0.16, type='sine', gain=0.05, delay=0, glideTo=null, filterFreq=2600}={}){
    const c = getCtx();
    if(!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const amp = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur*0.9);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.linearRampToValueAtTime(gain, t0 + 0.015);
    amp.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
    osc.connect(filter); filter.connect(amp); amp.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  return {
    // gentle tap for generic buttons/cards
    tap(){ if(!state.sound) return; note(540, {dur:.07, type:'sine', gain:.045, filterFreq:2200}); },
    // airy two-note swoosh for screen navigation
    select(){ if(!state.sound) return; note(600,{dur:.09,gain:.035}); note(840,{dur:.1,gain:.02,delay:.035}); },
    // soft mellow click for switches, pitched by on/off
    toggle(on){ if(!state.sound) return; note(on?720:440,{dur:.09,type:'triangle',gain:.04,filterFreq:1800}); },
    // gentle rising chime for correct answers
    correct(){ if(!state.sound) return; note(523.25,{dur:.12,gain:.05}); note(659.25,{dur:.15,gain:.05,delay:.07}); note(783.99,{dur:.22,gain:.04,delay:.14}); },
    // soft downward tone for wrong answers — never harsh
    wrong(){ if(!state.sound) return; note(340,{dur:.22,type:'sine',gain:.04,glideTo:230,filterFreq:1400}); },
    // warm little fanfare for level-ups/achievements/rewards
    success(){ if(!state.sound) return; [523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,{dur:.28,gain:.045,delay:i*.09})); },
    // soft bloom for modals opening
    open(){ if(!state.sound) return; note(440,{dur:.11,gain:.03}); note(660,{dur:.14,gain:.025,delay:.045}); }
  };
})();

/* -------- Seeded random (mulberry32) -------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeRng(seed){ const r = mulberry32(seed); return {
  next:r,
  int(min,max){ return Math.floor(r()*(max-min+1))+min; },
  pick(arr){ return arr[Math.floor(r()*arr.length)]; },
  shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;},
  chance(p){ return r()<p; }
};}

    title:{ru:'Сложение и вычитание',uz:"Qo'shish va ayirish"},
    desc:{ru:'Базовые операции с числами',uz:"Sonlar bilan oddiy amallar"},
    formula:()=> `a + b = c, \\qquad a - b = d`,
    theory:{
      ru:[

/* -------- Generate 100 topics -------- */
function generateAllTopics(){
  // Each level gets 10 topics. Difficulty scales with level.
  // Distribute templates across levels: each template appears ~6-7 times with varying parameters.
  const topics = [];
  const perLevel = 10;
  const levels = 10;

  // Parameter profiles by level
  function paramsFor(tpl, level, variant){
    // level is 1..10
    const L = level;
    const p = {};
    switch(tpl.id){
      case 'addsub': p.range = 10 + L*8; break;
      case 'mul': p.maxA = Math.min(5 + L, 20); p.maxB = Math.min(5 + L, 20); break;
      case 'div': p.max = Math.min(6 + L, 20); break;
      case 'frac': p.m = Math.min(4 + Math.floor(L/2), 12); break;
      case 'percent': p.m = L; break;
      case 'linear': p.max = 5 + L; break;
      case 'power': p.max = Math.min(3 + Math.floor(L/2), 10); p.exp = Math.min(2 + Math.floor(L/3), 5); break;
      case 'root': p.max = Math.min(4 + L, 20); break;
      case 'pyth': p.v = variant; break;
      case 'area': p.v = variant; break;
      case 'perim': p.v = variant; break;
      case 'quad': p.max = Math.min(4 + L, 20); break;
      case 'arith-prog': p.v = variant; break;
      case 'angles': p.v = variant; break;
      case 'logic': p.v = variant; break;
    }
    return p;
  }

  // Topic name suffixes by level (to distinguish variations)
  const suffix = {
    ru: [
      'базовый уровень','начальный курс','простые примеры','первые задачи',
      'средний уровень','стандартные задачи','с углублением',
      'повышенная сложность','продвинутый уровень','мастер-класс'
    ],
    uz: [
      'boshlang‘ich','oddiy misollar','birinchi masalalar',
      "o'rta daraja","standart masalalar",'chuqurlashtirilgan',
      'murakkab daraja','yuqori daraja','ekspert-daraja','master-klass'
    ]
  };

  // Distribute templates per level in a round-robin so we have variety
  // We'll build an assignment array of length 100 (10 levels * 10)
  // Each of 15 templates appears at least 6 times, some 7.
  const order = [];
  for(let i=0;i<100;i++) order.push(TEMPLATES[i % TEMPLATES.length]);
  // shuffle per level but deterministic
  const gRng = makeRng(42);
  for(let lv=1; lv<=levels; lv++){
    const slice = order.slice((lv-1)*perLevel, lv*perLevel);
    // choose unique distribution
    const chosen = gRng.shuffle(slice);
    for(let i=0;i<perLevel;i++){
      const tpl = chosen[i];
      const params = paramsFor(tpl, lv, i);
      topics.push({
        id: `L${lv}_T${i+1}_${tpl.id}`,
        level: lv,
        templateId: tpl.id,
        tplIdx: TEMPLATES.indexOf(tpl),
        params: params,
        seed: lv*1000 + i*37 + TEMPLATES.indexOf(tpl)*7,
        titleKey: tpl.title,
        descKey: tpl.desc,
        suffixIdx: lv-1
      });
    }
  }
  return topics;
}

function ensureDaily(){
  const today = new Date().toISOString().slice(0,10);
  if(state.dailyDate !== today){
    state.dailyDate = today;
    state.dailyDone = [];
    // pick 3 tasks deterministic per day
    const r = makeRng(hashStr(today));
    state.dailyTasks = r.shuffle(DAILY_DEFS).slice(0,3).map(d=>({id:d.id, progress:0, done:false}));
    state.dailyProgress = { loginToday: 0 };
    saveState();
  }
  if(!state.dailyProgress) state.dailyProgress = {};
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

function updateDailyProgress(kind, amount=1){
  ensureDaily();
  // Map external kind to storage key (coins30 uses 'coins' for accumulation)
  const storeKey = kind==='coins30' ? 'coins' : kind;
  state.dailyProgress[storeKey] = (state.dailyProgress[storeKey]||0) + amount;
  for(const td of state.dailyTasks){
    const def = DAILY_DEFS.find(d=>d.id===td.id);
    if(def && !state.dailyDone.includes(td.id)){
      let prog = 0;
      switch(def.id){
        case 'ans5': prog=Math.min(state.dailyProgress.ans5||0,5); break;
        case 'ans15': prog=Math.min(state.dailyProgress.ans15||0,15); break;
        case 'topic1': prog=Math.min(state.dailyProgress.topic1||0,1); break;
        case 'perfect': prog=Math.min(state.dailyProgress.perfect||0,1); break;
        case 'coins30': prog=Math.min(state.dailyProgress.coins||0,30); break;
        case 'streak': prog= state.dailyProgress.loginToday?1:0; break;
      }
      td.progress = prog;
      if(def.check(state, {dailyProgress: state.dailyProgress})){
        td.done = true;
        if(!state.dailyDone.includes(td.id)){
          state.dailyDone.push(td.id);
          state.xp += def.reward.xp;
          state.coins += def.reward.coins;
          toast(t('earned_xp',{n:def.reward.xp})+' · '+t('earned_coins',{n:def.reward.coins}), 'good');
          Haptic.notif('success');
          SoundEngine.success();
          checkLevelUp();
          checkAchievements();
        }
      }
    }
  }
  saveState();
}

function xpForLevel(l){ return 100 * Math.pow(1.25, l-1) | 0; }
function addXP(amount){
  state.xp += amount;
  checkLevelUp();
}
function checkLevelUp(){
  while(state.xp >= xpForLevel(state.lvl)){
    state.xp -= xpForLevel(state.lvl);
    state.lvl++;
    state.coins += 50;
    toast(t('new_level')+': '+state.lvl, 'good');
    Haptic.notif('success');
    SoundEngine.success();
  }
  saveState();
}
function checkAchievements(){
  for(const a of ACHIEVEMENTS){
    if(!state.achievements[a.id] && a.check(state)){
      state.achievements[a.id] = true;
      state.coins += 25;
      toast('🏆 '+(a.name[state.lang]||a.name.ru), 'good');
      Haptic.notif('success');
      SoundEngine.success();
    }
  }
  saveState();
}
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(state.lastActive === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yest = y.toISOString().slice(0,10);
  if(state.lastActive === yest) state.streak++;
  else state.streak = 1;
  state.lastActive = today;
  state.dailyProgress = state.dailyProgress||{};
  state.dailyProgress.loginToday = 1;
  saveState();
}

   ============================================================ */
function buildExercises(topic, count=10){
  const tpl = TEMPLATES[topic.tplIdx];
  const rng = makeRng(topic.seed);
  const ex = [];
  for(let i=0;i<count;i++){
    const exseed = topic.seed + i*131;
    const r = makeRng(exseed);
    ex.push(tpl.gen(r, topic.params));
  }
  return ex;
}
function buildExam(level, count=20){
  // combine all topics of level
  const topics = ALL_TOPICS.filter(x=>x.level===level);
  const allEx = [];
  const r = makeRng(Date.now());
  for(const tp of topics){
    const exs = buildExercises(tp, 2);
    allEx.push(...exs);
  }
  return r.shuffle(allEx).slice(0,count);
}

let currentSession = null;
let lastSessionCtx = null;

function startSession(topics, mode='practice', title=''){
  if(!Array.isArray(topics)) topics = [topics];
  let exercises = [];
  if(mode==='exam'){
    exercises = buildExam(topics[0].level);
  } else {
    for(const tp of topics){
      exercises.push(...buildExercises(tp, 10));
    }
  }
  currentSession = {
    mode,
    title,
    exercises,
    index: 0,
    correct: 0,
    answered: 0,
    topicId: topics.length===1 ? topics[0].id : null,
    topic: topics.length===1 ? topics[0] : null,
    earnedCoins:0, earnedXp:0
  };
  switchScreen('exercise');
  renderExercise();
}

  renderKatex(fbox, fLatex);

  // start button
  const btn = el('button','btn-primary');
  btn.textContent = t('start_practice');
  btn.addEventListener('click', ()=>{
    startSession(tp, 'practice', tpl.title[state.lang]);
  });
  host.appendChild(btn);

  if(s?.completed){
    const btn2 = el('button','btn-secondary');
    btn2.textContent = t('retry');
    btn2.addEventListener('click', ()=>startSession(tp, 'practice', tpl.title[state.lang]));
    host.appendChild(btn2);
  }
}

/* -------- KaTeX renderer -------- */
const katexQueue = [];
function renderKatex(el, latex){
  if(!window.katex){
    katexQueue.push([el, latex]);
    return;
  }
  try {
    katex.render(latex, el, { displayMode:true, throwOnError:false, trust:false });
  } catch(e){
    el.textContent = latex;
  }
}
window.addEventListener('load', ()=>{
  const iv = setInterval(()=>{
    if(window.katex){
      clearInterval(iv);
      while(katexQueue.length){
        const [e,l] = katexQueue.shift();
        renderKatex(e,l);
      }
    }
  },50);
});

/* -------- Exercise rendering -------- */
function renderExercise(){
  const host = document.getElementById('exercise-content');
  document.getElementById('exercise-title').textContent = currentSession.mode==='exam' ? t('exam_t') : (currentSession.title||t('start_practice'));
  host.innerHTML = '';
  const ses = currentSession;
  if(!ses) return;
  const total = ses.exercises.length;
  const ex = ses.exercises[ses.index];
  if(!ex){ finishSession(); return; }

  const wrap = el('div','fade-in');
  wrap.innerHTML = `
    <div class="exercise-top">
      <div class="ex-progress">
        <span>${ses.index+1} / ${total}</span>
        <div class="bar"><span style="width:${(ses.index/total)*100}%"></span></div>
        <span>${ses.correct}✓</span>
      </div>
      <div class="question-box" id="qbox">${ex.q}</div>
    </div>
  `;
  host.appendChild(wrap);

  if(ex.options){
    const grid = el('div','answers');
    for(const opt of ex.options){
      const btn = el('button','answer-btn');
      btn.textContent = opt;
      btn.addEventListener('click', ()=>handleAnswer(btn, opt, opt==String(ex.answer)));
      grid.appendChild(btn);
    }
    host.appendChild(grid);
  } else {
    const box = el('div','answer-single');
    const input = el('input','input-answer');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.placeholder = t('enter_answer');
    const btn = el('button','btn-primary');
    btn.textContent = t('submit');
    const submit = ()=>{
      const val = input.value.trim().replace(',','.');
      if(val==='') return;
      const num = parseFloat(val);
      let ok = false;
      if(!isNaN(num)){
        if(typeof ex.answer === 'number'){
          ok = Math.abs(num - ex.answer) < 0.6;
        } else {
          ok = String(val) === String(ex.answer);
        }
      } else {
        ok = String(val).toLowerCase() === String(ex.answer).toLowerCase();
      }
      handleAnswer(btn, val, ok, input);
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    box.appendChild(input);
    box.appendChild(btn);
    host.appendChild(box);
    setTimeout(()=>input.focus(), 250);
  }
}
function handleAnswer(btn, chosen, correct, input){
  const ses = currentSession;
  if(ses.answeredLocked) return;
  ses.answeredLocked = true;
  ses.answered++;
  state.totalAnswered++;

  // disable buttons
  if(!input){
    const all = btn.parentElement.querySelectorAll('.answer-btn');
    all.forEach(b=>{
      b.disabled = true;
      if(b.textContent == String(ses.exercises[ses.index].answer)) b.classList.add('correct');
    });
    if(correct) btn.classList.add('correct'); else btn.classList.add('wrong');
  } else {
    input.disabled = true;
    btn.disabled = true;
    if(correct) btn.style.background = 'var(--good)';
    else btn.style.background = 'var(--bad)';
  }

  if(correct){
    ses.correct++;
    state.correctAnswered++;
    Haptic.notif('success');
    SoundEngine.correct();
    const xpG = currentSession.mode==='exam' ? 6 : 4;
    const cG = currentSession.mode==='exam' ? 3 : 2;
    ses.earnedXp += xpG;
    ses.earnedCoins += cG;
    state.xp += xpG;
    state.coins += cG;
    updateDailyProgress('ans5');
    updateDailyProgress('ans15');
    updateDailyProgress('coins30', cG);
  } else {
    Haptic.notif('error');
    SoundEngine.wrong();
    // ans5/ans15 count total answers? We count only correct. But allow attempt counting:
    state.dailyProgress.ans5 = state.dailyProgress.ans5||0;
    state.dailyProgress.ans15 = state.dailyProgress.ans15||0;
  }

  checkLevelUp();
  checkAchievements();
  saveState();

  setTimeout(()=>{
    ses.index++;
    ses.answeredLocked = false;
    if(ses.index >= ses.exercises.length){
      finishSession();
    } else {
      renderExercise();
    }
  }, correct ? 700 : 1000);
}

function finishSession(){
  const ses = currentSession;
  // Save context for retry
  lastSessionCtx = ses.mode==='exam'
    ? { mode:'exam', level: ses.topic?.level || currentLevel }
    : { mode:'practice', topic: ses.topic };
  const total = ses.exercises.length;
  const acc = total>0 ? Math.round(ses.correct/total*100) : 0;
  // Bonus coins for high score
  let bonusCoins = 0, bonusXp = 0;
  if(ses.mode === 'practice' && ses.topicId){
    const tp = ses.topic;
    const stars = Math.min(3, Math.max(0, Math.round(acc/100*3)));
    state.topics[tp.id] = {
      completed: acc>=50 || (state.topics[tp.id]?.completed),
      score: Math.max(state.topics[tp.id]?.score||0, ses.correct),
      stars: Math.max(state.topics[tp.id]?.stars||0, stars)
    };
    if(acc === 100){
      state.dailyProgress.perfect = (state.dailyProgress.perfect||0)+1;
      updateDailyProgress('perfect');
    }
    if(acc>=50){
      state.dailyProgress.topic1 = (state.dailyProgress.topic1||0)+1;
      updateDailyProgress('topic1');
    }
    bonusXp = Math.round(acc*0.5);
    bonusCoins = Math.round(acc*0.3);
    state.xp += bonusXp;
    state.coins += bonusCoins;
    // unlock exam for this level if all topics done
    if(isLevelCompleted(tp.level) && !state.examUnlocked.includes(tp.level+1) && tp.level<10){
      state.examUnlocked.push(tp.level+1);
      toast('🎓 '+ (state.lang==='ru'?'Открыт новый экзамен!':'Yangi imtihon ochildi!'), 'good');
    }
  }
  if(ses.mode === 'exam'){
    // big bonus
    const passed = acc >= 70;
    if(passed){
      bonusXp = 200; bonusCoins = 150;
      state.xp += bonusXp; state.coins += bonusCoins;
    } else {
      bonusXp = 50; bonusCoins = 20;
      state.xp += bonusXp; state.coins += bonusCoins;
    }
  }
  checkLevelUp();
  checkAchievements();
  updateStreak();
  updateDailyProgress('streak');
  saveState();

  showModal(buildResultModal(ses, acc, bonusXp, bonusCoins));
  currentSession = null;
}

/* -------- Modal -------- */
function showModal(html){
  const m = document.getElementById('modal');
  document.getElementById('modal-inner').innerHTML = html;
  m.classList.add('show');
  Haptic.impact('medium');
  SoundEngine.open();
}
function hideModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id==='modal') hideModal();
});
function buildResultModal(ses, acc, bonusXp, bonusCoins){
  const totalXP = ses.earnedXp + bonusXp;
  const totalC = ses.earnedCoins + bonusCoins;
  const examMsg = ses.mode==='exam' ? (acc>=70 ? (state.lang==='ru'?'🏆 Экзамен сдан!':'🏆 Imtihon topshirildi!') : (state.lang==='ru'?'❌ Не сдали (нужно 70%)':'❌ Topshirmadingiz (70% kerak)')) : '';
  return `
    <h2>${ses.mode==='exam'? t('exam_t') : (ses.correct===ses.exercises.length?'🏆 '+t('topic_completed') : t('results'))}</h2>
    ${examMsg?`<div style="color:var(--muted);font-size:13px">${examMsg}</div>`:''}
    <div class="modal-stats">
      <div class="modal-stat"><div class="v">${ses.correct}/${ses.exercises.length}</div><div class="l">${t('correct_a')}</div></div>
      <div class="modal-stat"><div class="v">${acc}%</div><div class="l">${t('result_acc')}</div></div>
      <div class="modal-stat"><div class="v">+${totalXP}</div><div class="l">${t('result_xp')}</div></div>
    </div>
    <div style="color:var(--gold);font-weight:700;margin-bottom:10px">🪙 +${totalC}</div>
    <button class="btn-primary" id="m-ok">${t('back_to')}</button>
    <button class="btn-secondary" id="m-retry">${t('retry')}</button>
  `;
}
document.addEventListener('click', e=>{
  if(e.target.id==='m-ok'){
    hideModal();
    if(lastSessionCtx?.mode==='practice' && lastSessionCtx.topic){
      currentTopic = lastSessionCtx.topic;
      switchScreen('topic');
      renderTopic();
    } else {
      switchScreen('home');
    }
  }
  if(e.target.id==='m-retry'){
    hideModal();
    if(currentSession) return;
    if(lastSessionCtx){
      if(lastSessionCtx.mode==='exam'){
        const lt = ALL_TOPICS.find(x=>x.level===lastSessionCtx.level);
        if(lt) startSession(lt, 'exam');
      } else if(lastSessionCtx.topic){
        startSession(lastSessionCtx.topic, 'practice', TEMPLATES[lastSessionCtx.topic.tplIdx].title[state.lang]);
      }
    } else {
      switchScreen('home');
    }
  }
});
function buildExitModal(){
  return `
    <h2>${state.lang==='ru'?'Выйти?':'Chiqish?'}</h2>
    <p style="color:var(--muted);margin:10px 0 20px">${state.lang==='ru'?'Прогресс будет потерян.':'Taraqqiyot saqlanmaydi.'}</p>
    <button class="btn-primary" id="m-exit-yes">${state.lang==='ru'?'Выйти':'Chiqish'}</button>
    <button class="btn-secondary" id="m-exit-no">${t('cancel')}</button>
  `;
}
document.addEventListener('click', e=>{
  if(e.target.id==='m-exit-yes'){ hideModal(); currentSession=null; switchScreen('home'); }
  if(e.target.id==='m-exit-no'){ hideModal(); }
});

/* -------- Achievements screen -------- */
function renderAchievements(){
  const host = document.getElementById('ach-content');
  host.innerHTML = '';
  host.appendChild(el('div','section-title', t('achievements_t')));
  for(const a of ACHIEVEMENTS){
    const done = !!state.achievements[a.id];
    const prog = a.getProgress(state);
    const card = el('div','card ach-card'+(done?' unlocked':''));
    card.innerHTML = `
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-body">
        <div class="card-title" style="font-size:14px">${a.name[state.lang]}</div>
        <div class="card-desc">${a.desc[state.lang]}</div>
        <div class="ach-prog"><span style="width:${Math.min(100,prog/a.target*100)}%"></span></div>
        <div class="card-desc" style="margin-top:4px">${Math.min(prog,a.target)}/${a.target} · +25🪙</div>
      </div>
    `;
    host.appendChild(card);
  }
}

/* -------- Stats / settings -------- */
function renderStats(){
  const host = document.getElementById('stats-content');
  host.innerHTML = '';
  const acc = state.totalAnswered>0 ? Math.round(state.correctAnswered/state.totalAnswered*100) : 0;
  const stats = [
    [t('stats_total'), state.totalAnswered],
    [t('stats_correct'), state.correctAnswered],
    [t('stats_accuracy'), acc+'%'],
    [t('stats_topics'), topicsDone(state)+'/100'],
    [t('stats_xp'), state.xp + ` (${t('level')} ${state.lvl})`],
    [t('stats_coins'), state.coins],
    [t('stats_streak'), state.streak]
  ];
  const grid = el('div');
  grid.style.display='grid'; grid.style.gridTemplateColumns='1fr 1fr'; grid.style.gap='8px';
  for(const [l,v] of stats){
    const c = el('div','card');
    c.style.padding='12px'; c.style.textAlign='center';
    c.innerHTML = `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px">${l}</div><div style="font-size:20px;font-weight:800;margin-top:4px">${v}</div>`;
    grid.appendChild(c);
  }
  host.appendChild(grid);

  host.appendChild(el('div','section-title', t('settings_lang')));
  const langRow = el('div','lang-row');
  for(const lg of ['ru','uz']){
    const b = el('button','lang-btn'+(state.lang===lg?' active':''));
    b.textContent = lg==='ru'?'Русский':'O‘zbekcha';
    b.addEventListener('click', ()=>{
      state.lang = lg; saveState(); renderStats(); renderHome(); applyLocales();
      document.documentElement.lang = lg;
    });
    langRow.appendChild(b);
  }
  host.appendChild(langRow);

  host.appendChild(el('div','section-title', t('settings_theme')));
  const themeGrid = el('div','theme-grid');
  const themes = ['aurora','sunset','forest','ocean','lava','mint','candy','graphite','royal','dark'];
  for(const th of themes){
    const b = el('div','theme-opt'+(state.theme===th?' selected':''));
    b.dataset.t = th;
    b.addEventListener('click', ()=>{
      state.theme = th; saveState();
      document.body.className = 'theme-'+th;
      if(tg){ try{ tg.setHeaderColor(getComputedStyle(document.body).getPropertyValue('--bg').toString().trim()); }catch(e){} }
      renderStats();
    });
    themeGrid.appendChild(b);
  }
  host.appendChild(themeGrid);

  // Sound toggle
  const srow = el('div','setting-row');
  srow.innerHTML = `
    <div><div class="setting-label">${t('settings_sound')}</div><div class="setting-sub">${state.lang==='ru'?'Мягкие звуки интерфейса':'Muloyim interfeys ovozlari'}</div></div>
    <button class="switch ${state.sound?'on':''}" id="sw-sound"></button>
  `;
  host.appendChild(srow);

  // Haptic toggle
  const hrow = el('div','setting-row');
  hrow.innerHTML = `
    <div><div class="setting-label">${t('settings_haptic')}</div><div class="setting-sub">Telegram WebApp</div></div>
    <button class="switch ${state.haptic?'on':''}" id="sw-haptic"></button>
  `;
  host.appendChild(hrow);

  // Reset
  const rrow = el('div','setting-row');
  rrow.innerHTML = `
    <div><div class="setting-label" style="color:var(--bad)">${t('settings_reset')}</div><div class="setting-sub">${t('settings_reset_desc')}</div></div>
  `;
  const rb = el('button','btn-secondary');
  rb.style.flex='0'; rb.style.margin='0'; rb.style.padding='10px 14px'; rb.textContent = '↻';
  rb.addEventListener('click', ()=>{
    showModal(`
      <h2>${t('settings_reset')}</h2>
      <p style="color:var(--muted);margin:10px 0 20px">${t('settings_reset_desc')}</p>
      <button class="btn-primary" id="m-reset-yes" style="background:linear-gradient(135deg,var(--bad),#ff4444)">${t('reset_confirm')}</button>
      <button class="btn-secondary" id="m-reset-no">${t('cancel')}</button>
    `);
  });
  rrow.appendChild(rb);
  host.appendChild(rrow);

  // Bind sound switch
  const swSound = document.getElementById('sw-sound');
  if(swSound) swSound.addEventListener('click', ()=>{
    state.sound = !state.sound;
    saveState();
    SoundEngine.toggle(state.sound);
    renderStats();
  });

  // Bind haptic switch
  const sw = document.getElementById('sw-haptic');
  if(sw) sw.addEventListener('click', ()=>{
    state.haptic = !state.haptic;
    saveState(); renderStats();
    SoundEngine.toggle(state.haptic);
  });
}
document.addEventListener('click', e=>{
  if(e.target.id==='m-reset-yes'){
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    hideModal();
    toast(t('reset_done'), 'good');
    switchScreen('home');
  }
  if(e.target.id==='m-reset-no') hideModal();
});

/* -------- Apply static locales (for elements with data-i18n) -------- */
function applyLocales(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.getElementById('app-title').textContent = t('app_name');
  document.title = t('app_name');
}

/* -------- Toast -------- */
let toastTimer = null;
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show'+(type?' '+type:'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}

/* -------- Visibility (streak) -------- */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) updateStreak();
});

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  updateStreak();
  ensureDaily();
  // Try to match telegram theme
  if(tg?.themeParams){
    try{
      const scheme = tg.colorScheme;
      if(scheme && state.theme==='aurora'){
        // keep our premium themes regardless — user can switch
      }
    }catch(e){}
  }
  // If Telegram's user locale is Uzbek, switch (only if first run)
  try{
    if(tg?.initDataUnsafe?.user?.language_code){
      const code = tg.initDataUnsafe.user.language_code;
      if(!localStorage.getItem(STORAGE_KEY) && code.startsWith('uz')) state.lang='uz';
    }
  }catch(e){}

  document.body.className = 'theme-'+state.theme;
  applyLocales();
  switchScreen('home');
  // If all topics done, mark
  checkAchievements();
})();
